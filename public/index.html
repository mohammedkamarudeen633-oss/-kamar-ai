<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamar AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">K</div>
      <div>
        <h1>Kamar AI</h1>
        <p>Your AI assistant</p>
      </div>
    </header>

    <main id="chat">
      <div class="message bot">
        Hello 👋 I'm Kamar AI. How can I help you?
      </div>
    </main>

    <div class="input-area">
      <input
        id="message"
        type="text"
        placeholder="Ask Kamar AI anything..."
      >

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
